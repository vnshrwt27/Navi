[workspace]
resolver = "3"
members = [
  "crates/*",
  "xtask"
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
uuid = { version = "1.10", features = ["v4", "v7", "serde"] }
clap = { version = "4", features = ["derive"] }
tree-sitter = "0.24"
tree-sitter-rust = "0.23"
tree-sitter-python = "0.23"
tree-sitter-java = "0.23"
console = "0.16"
indicatif = "0.18"
rayon = "1.12.0"
streaming-iterator = "0.1.9"